# The IAM database users. These are not secret, but they are referenced through
# a Secret because that is what the base deployments read the username from.
#
# They are deliberately separate from mysql-secret: that Secret's username and
# password still belong to the metadata server, which cannot use IAM
# authentication yet.
apiVersion: v1
kind: Secret
metadata:
  name: kfp-db-users
stringData:
  apiserverUser: kfp_apiserver
  cacheUser: kfp_cache
